name: Gerar APK Android (Pro-Atleta)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. Compilar APK (Debug)
        run: gradle assembleDebug --stacktrace

      - name: 5. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: ProAtleta-APK-Instalador
          path: app/build/outputs/apk/debug/app-debug.apk
